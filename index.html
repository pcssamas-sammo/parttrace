<style>
/* Layout: phone-first single column app shell, sticky header, bottom tab bar with raised scan button */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F3F4F8; --line:#E5E7EB; --field:#F9FAFB;
  --fg:#111827; --muted:#6B7280; --ph:#9CA3AF;
  --brand:#3F5BE0; --brand-ink:#FFFFFF; --brand-soft:#EDF0FD; --navy:#0B1A3A; --navy-ink:#FFFFFF;
  --ok:#1E7D4F; --ok-soft:#DFF2E8; --warn:#A35E00; --warn-soft:#FBEBD3; --bad:#B42318; --bad-soft:#FBE1DE; --info:#2C5C9E; --info-soft:#E1EAF7;
  --f-body:"Inter","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#171C2B; --surface2:#1F2536; --line:#2C3346; --field:#1C2232;
  --fg:#EEF1F7; --muted:#9AA3B6; --ph:#6F788C; --brand:#7D93FF; --brand-ink:#0B1230; --brand-soft:#212B4D; --navy:#E3E8F4; --navy-ink:#0B1A3A;
  --ok:#5CC793; --ok-soft:#173326; --warn:#F0AE52; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1D1A; --info:#8DB4EC; --info-soft:#1B2A3F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171C2B; --surface2:#1F2536; --line:#2C3346; --field:#1C2232;
  --fg:#EEF1F7; --muted:#9AA3B6; --ph:#6F788C; --brand:#7D93FF; --brand-ink:#0B1230; --brand-soft:#212B4D; --navy:#E3E8F4; --navy-ink:#0B1A3A;
  --ok:#5CC793; --ok-soft:#173326; --warn:#F0AE52; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1D1A; --info:#8DB4EC; --info-soft:#1B2A3F; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.app{max-width:620px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .back{background:none;border:0;color:#fff;font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;font-size:12px;padding:3px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#8E3A86;font-weight:600}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.banner{background:var(--info-soft);color:var(--info);border-radius:var(--r);padding:10px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.bigact{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;cursor:pointer;background:var(--surface);border:1px solid var(--line)}
.bigact.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bigact .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.bigact.primary .ic{background:rgba(255,255,255,.2);color:var(--brand-ink)}
.bigact strong{display:block;font-size:17px}
.bigact small{opacity:.8;font-size:13px}
.acts{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item:hover{background:var(--surface2)}
.item .body{flex:1;min-width:0}
.item .t,.item .s{display:block}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.child{padding-left:36px;background:var(--surface)}
.item.child::before{content:"";width:10px;height:18px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);margin-left:-20px;margin-top:-14px;flex:none;border-bottom-left-radius:4px}
.thumb{width:42px;height:42px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--brand);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-in_store{background:var(--ok-soft);color:var(--ok)}
.st-installed{background:var(--info-soft);color:var(--info)}
.st-removed{background:var(--warn-soft);color:var(--warn)}
.st-repair_in,.st-repair_out{background:var(--warn-soft);color:var(--warn)}
.st-scrapped{background:var(--surface2);color:var(--muted)}
.alert-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.sev-bad{background:var(--bad-soft);color:var(--bad)} .sev-warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:18px;color:var(--muted);text-align:center;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:46px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.bigact:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:16px}
textarea{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:1px}
.check b{display:block} .check small{color:var(--muted)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.stepname{font-size:13px;color:var(--muted);margin-top:6px}
.scanbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px;border:2px dashed var(--brand);border-radius:16px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:17px;cursor:pointer;width:100%}
.idbig{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:.02em}
.result{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.warn{background:var(--warn-soft);color:var(--warn)} .result.bad{background:var(--bad-soft);color:var(--bad)} .result.info{background:var(--info-soft);color:var(--info)}
.results{display:flex;flex-direction:column;gap:6px}
.gps{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--warn);animation:pulse 1s infinite} .dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.wait{animation:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hero{display:flex;gap:14px;align-items:center}
.hero .thumb{width:72px;height:72px;font-size:22px;border-radius:14px}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tl:first-child{border-top:0}
.tl time{color:var(--muted);font-size:12px;min-width:76px;font-variant-numeric:tabular-nums}
.tl .flag{color:var(--warn);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:600}
nav.tabs button.scan .ic{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px rgba(142,58,134,.35)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,5,12,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{margin:0;font-size:17px}
.viewfinder{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;background:#000;border-radius:12px;overflow:hidden}
.viewfinder video{width:100%;height:100%;object-fit:cover}
.viewfinder::after{content:"";position:absolute;inset:18% 22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.viewfinder .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:14px;z-index:2}
.inline{display:flex;gap:8px} .inline input{flex:1;min-width:0}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.label{background:#fff;color:#111;border:1px dashed #bbb;border-radius:8px;padding:8px;text-align:center;break-inside:avoid}
.label svg{width:100%;height:auto;display:block}
.label .mono{font-size:12px;display:block;margin-top:2px}
.label small{font-size:10px;color:#555;display:block;line-height:1.2}
.qrbox{background:#fff;border-radius:12px;padding:12px;width:180px;max-width:100%;margin:0 auto}
.qrbox svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.photo-in{display:flex;gap:12px;align-items:center}
.photo-in img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.muted{color:var(--muted)} .small{font-size:13px}
.warnmark{color:var(--bad);font-weight:700}

/* restyle: white header, filled form fields, blue primary + navy secondary buttons */
header.top{background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line)}
header.top .back{color:var(--fg)}
body::before{background:var(--surface)}
.pill{background:var(--brand-soft);color:var(--brand)}
.lang{border-color:var(--line)}
.lang button{color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.btn{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);border-radius:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.outline{background:var(--surface);color:var(--fg);border-color:var(--line)}
label.f{color:var(--fg);font-size:15px;font-weight:500;gap:8px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--field);border-color:var(--line);border-radius:6px}
::placeholder{color:var(--ph)}
.check{background:var(--field);border-radius:6px}
.scanbtn{border-radius:10px;border-width:1.5px}
.bigact{border-radius:10px}
.bigact.primary{background:var(--brand);border-color:var(--brand)}
nav.tabs button.scan .ic{box-shadow:0 4px 14px rgba(63,91,224,.35)}
.form{gap:16px}
.photo-in .thumb{border:1.5px dashed var(--line);background:var(--field)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media print{
  header.top,nav.tabs,.noprint,.banner{display:none!important}
  body{background:#fff} body::before{display:none} main{padding:0}
  .app{max-width:none;padding:0}
  .labels{grid-template-columns:repeat(4,1fr)}
  .label{border:1px dashed #999}
}
</style>
</head>

/* ---------- IndexedDB (falls back to memory) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open("parttrace",1);
    r.onupgradeneeded=()=>{const d=r.result;["parts","locations","events","photos","meta"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})},
  tx(s,m){return this.db.transaction(s,m).objectStore(s)},
  all(s){return new Promise(res=>{if(!this.db)return res([]);try{const r=this.tx(s,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])}catch(e){res([])}})},
  put(s,o){if(!this.db)return;try{this.tx(s,"readwrite").put(o)}catch(e){}},
  clear(s){if(!this.db)return;try{this.tx(s,"readwrite").clear()}catch(e){}}
};
function saveSet(){DB.put("meta",set)}
function putPart(p){const i=S.parts.findIndex(x=>x.id===p.id);if(i<0)S.parts.push(p);else S.parts[i]=p;DB.put("parts",p)}
function putLoc(l){const i=S.locations.findIndex(x=>x.id===l.id);if(i<0)S.locations.push(l);else S.locations[i]=l;DB.put("locations",l)}
function addEv(e){e.id=e.id||uid();e.ts=e.ts||Date.now();e.user=e.user||set.user;e.synced=!!e.synced;S.events.push(e);DB.put("events",e)}
function putPhoto(id,data){S.photos[id]=data;DB.put("photos",{id,data})}

/* ---------- lookups ---------- */
const P=id=>S.parts.find(p=>p.id===id);
const LO=id=>S.locations.find(l=>l.id===id);
const kids=id=>S.parts.filter(p=>p.parent===id);
function desc(id){const out=[];(function w(x){kids(x).forEach(k=>{out.push(k);w(k.id)})})(id);return out}
function rootOf(p){let r=p,g=0;while(r&&r.parent&&P(r.parent)&&g++<20)r=P(r.parent);return r}
function locPath(id){if(!id)return t("noLoc");const n=[];let l=LO(id),g=0;while(l&&g++<10){n.unshift(l.name);l=LO(l.parent)}return n.join(" › ")||id}
function locArea(id){let l=LO(id),g=0;while(l&&g++<10){if(l.lat!=null)return l;l=LO(l.parent)}return null}
function dist(a,b){const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))}
function ago(ts){if(!ts)return "—";const m=(Date.now()-ts)/6e4;if(m<1)return t("justnow");if(m<60)return t("minAgo",{n:Math.floor(m)});if(m<1440)return t("hAgo",{n:Math.floor(m/60)});return t("dAgo",{n:Math.floor(m/1440)})}
function fdate(ts){const d=new Date(ts);return d.toLocaleDateString(set.lang==="th"?"th-TH":"en-GB",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString(set.lang==="th"?"th-TH":"en-GB",{hour:"2-digit",minute:"2-digit"})}
function nextLabel(){return "AST-"+set.dev+String(set.labelSeq).padStart(5,"0")}
function initials(n){return (n||"?").replace(/[^A-Za-z0-9฀-๿ ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"}
function thumb(p,cls){const src=p&&p.photo&&S.photos[p.photo];return src?`<img class="thumb ${cls||""}" src="${src}" alt="">`:`<div class="thumb ${cls||""}" aria-hidden="true">${h(initials(p&&p.name))}</div>`}
function chip(s){return `<span class="chip st-${s}">${h(t("s_"+s))}</span>`}
const unsynced=()=>S.events.filter(e=>!e.synced).length;

/* ---------- alerts ---------- */
function alerts(){
  const out=[],now=Date.now();
  S.parts.filter(p=>!p.parent&&kids(p.id).length).forEach(r=>{
    const locs=new Set([r,...desc(r.id)].filter(p=>p.status!=="scrapped"&&p.status!=="installed"&&p.loc).map(p=>p.loc));
    if(locs.size>1)out.push({sev:"bad",part:r,txt:t("alSplit",{n:locs.size})})});
  S.parts.forEach(p=>{
    if(p.status==="scrapped")return;
    if((p.status==="repair_in"||p.status==="repair_out")&&now-(p.statusTs||0)>set.repairDays*DAY)out.push({sev:"warn",part:p,txt:t("alRepair",{d:Math.floor((now-p.statusTs)/DAY)})});
    else if(p.status!=="installed"&&now-(p.lastSeen||0)>set.notSeen*DAY)out.push({sev:"warn",part:p,txt:t("alNotSeen",{d:Math.floor((now-(p.lastSeen||0))/DAY)})});
    const le=S.events.filter(e=>e.part===p.id&&e.gpsOut!=null).sort((a,b)=>b.ts-a.ts)[0];
    const lastLoc=S.events.filter(e=>e.part===p.id&&(e.type==="CHECK"||e.type==="MOVE"||e.type==="REGISTER")).sort((a,b)=>b.ts-a.ts)[0];
    if(le&&lastLoc&&le.id===lastLoc.id&&le.gpsOut>0)out.push({sev:"warn",part:p,txt:t("alGps",{m:le.gpsOut})});
  });
  return out;
}

function evText(e){const p=e.parent?(P(e.parent)||{name:e.parent}).name:"";return t("ev_"+e.type,{p,l:locPath(e.loc),s:t("s_"+e.status)})}
function evRow(e){const p=P(e.part)||{name:e.part,id:e.part};return `<button class="item" data-act="part" data-id="${h(p.id)}">${thumb(p)}<span class="body"><span class="t">${h(p.name)}</span><span class="s">${h(evText(e))} · ${h(ago(e.ts))}</span></span></button>`}

function partRow(p,child){
  const nk=kids(p.id).length,split=!child&&nk&&alerts().some(a=>a.part.id===p.id&&a.sev==="bad");
  return `<button class="item ${child?"child":""}" data-act="part" data-id="${h(p.id)}">${thumb(p)}<span class="body"><span class="t">${split?'<span class="warnmark">! </span>':""}${h(p.name)}</span><span class="s"><span class="mono">${h(p.id)}</span>${p.owner?" · "+h(p.owner):""}${p.cref?` · <span class="mono">${h(p.cref)}</span>`:""} · ${h(locPath(p.loc))}${nk?" · "+h(t("comps",{n:nk})):""}</span></span>${chip(p.status)}</button>`;
}
function vParts(){
  const q=filt.q.trim().toLowerCase();
  const match=p=>(filt.st==="all"||p.status===filt.st)&&(!filt.own||(filt.own==="_own"?!p.owner:p.owner===filt.own))&&(!q||[p.id,p.name,p.serial,p.model,p.mfr,p.owner,p.src,p.cref,p.cwo].join(" ").toLowerCase().includes(q));
  let rows="";
  const roots=S.parts.filter(p=>!p.parent||!P(p.parent)).sort((a,b)=>a.name.localeCompare(b.name));
  roots.forEach(r=>{const d=desc(r.id),rm=match(r),dm=d.filter(match);if(rm||dm.length){rows+=partRow(r,false);(q||filt.st!=="all"||filt.own?dm:d).forEach(c=>rows+=partRow(c,true))}});
  return{title:t("parts"),html:`
  <div class="inline noprint"><input type="search" id="q" placeholder="${h(t("search"))}" value="${h(filt.q)}" aria-label="${h(t("search"))}"><button class="btn primary" data-act="startReg" aria-label="${h(t("actRegister"))}">${I.plus}</button></div>
  ${owners().length?`<select id="ownF" aria-label="${h(t("f_owner"))}"><option value="">${h(t("allOwners"))}</option><option value="_own" ${filt.own==="_own"?"selected":""}>${h(t("ownOwn"))}</option>${owners().map(o=>`<option ${filt.own===o?"selected":""}>${h(o)}</option>`).join("")}</select>`:""}
  <div class="chips">${["all",...STATUSES].map(s=>`<button data-act="filt" data-v="${s}" aria-pressed="${filt.st===s}">${h(s==="all"?t("all"):t("s_"+s))}</button>`).join("")}</div>
  <div class="list" id="plist">${rows||`<div class="empty">${h(t("noParts"))}</div>`}</div>`,
  after(){const of=$("#ownF");of&&of.addEventListener("change",()=>{filt.own=of.value;render()});const q=$("#q");q.addEventListener("input",()=>{filt.q=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)})}};
}

  const g=p.gps;
  return{title:p.name,html:`
  <section class="card hero">${thumb(p)}<div style="min-width:0;flex:1"><div class="mono muted">${h(p.id)}</div><div style="font-weight:700;font-size:18px">${h(p.name)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${chip(p.status)}${p.critical?`<span class="chip sev-bad">Critical</span>`:""}</div></div></section>
  <section class="card"><dl class="kv">
    <dt>${h(t("f_loc"))}</dt><dd>${p.loc?`<a href="#" data-act="loc" data-id="${h(p.loc)}">${h(locPath(p.loc))}</a>`:h(t("noLoc"))}<div class="small muted">${h(t("seen",{t:ago(p.lastSeen)}))}</div></dd>
    ${p.parent?`<dt>${h(t("series"))}</dt><dd>${h(t("partOf",{p:(P(p.parent)||{}).name||p.parent}))}</dd>`:""}
    <dt>${h(t("f_gps"))}</dt><dd>${g?`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} <span class="muted">±${Math.round(g.acc)} m</span><br><a href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank" rel="noopener">${h(t("openMap"))}</a>`:"—"}</dd>
    ${p.group?`<dt>${h(t("f_group"))}</dt><dd>${h(p.group)}</dd>`:""}
    ${p.mfr?`<dt>${h(t("f_mfr"))}</dt><dd>${h(p.mfr)}</dd>`:""}
    ${p.model?`<dt>${h(t("f_model"))}</dt><dd>${h(p.model)}</dd>`:""}
    ${p.serial?`<dt>${h(t("f_serial"))}</dt><dd class="mono">${h(p.serial)}</dd>`:""}
    ${p.owner?`<dt>${h(t("f_owner"))}</dt><dd>${h(p.owner)}</dd>`:""}
    ${p.src?`<dt>${h(t("f_src"))}</dt><dd>${h(p.src)}</dd>`:""}
    ${p.cref?`<dt>${h(t("f_cref"))}</dt><dd class="mono">${h(p.cref)}</dd>`:""}
    ${p.cwo?`<dt>${h(t("f_cwo"))}</dt><dd class="mono">${h(p.cwo)}</dd>`:""}
    <dt>${h(t("f_created"))}</dt><dd>${h(fdate(p.created))}</dd>
  </dl></section>
  <div class="btns"><button class="btn primary" data-act="checkPart" data-id="${h(p.id)}">${I.scan} ${h(t("checkThis"))}</button><button class="btn outline" data-act="push" data-v="editPart" data-id="${h(p.id)}">${h(t("edit"))}</button></div>
  <section><h2>${h(t("series"))}</h2><div class="list">
    ${hasSeries?mem.map(m=>{const diff=m.loc!==root.loc&&m.status!=="installed"&&m.status!=="scrapped";return `<button class="item ${m.id===root.id?"":"child"}" data-act="part" data-id="${h(m.id)}" ${m.id===id?'style="background:var(--brand-soft)"':""}>${thumb(m)}<span class="body"><span class="t">${diff?'<span class="warnmark">! </span>':""}${h(m.name)}</span><span class="s"><span class="mono">${h(m.id)}</span> · ${h(locPath(m.loc))}</span></span>${chip(m.status)}</button>`}).join(""):`<div class="empty">${h(t("noComps"))}</div>`}
  </div>

/* photo capture (file input works on every phone, also offline) */
let pendingPhoto=null;
function photoField(pid){pendingPhoto=null;const src=pid&&S.photos[pid];return `<div class="photo-in">${src?`<img id="phPrev" src="${src}" alt="">`:`<div class="thumb" id="phPrev" style="width:72px;height:72px">${I.cam}</div>`}<label class="btn outline">${I.cam} ${h(t(src?"changePhoto":"addPhoto"))}<input type="file" id="phIn" accept="image/*" capture="environment" hidden></label></div>`}
function bindPhoto(cb){const i=$("#phIn");if(!i)return;i.addEventListener("change",async()=>{const f=i.files[0];if(!f)return;const d=await shrink(f);const id="ph_"+uid();putPhoto(id,d);pendingPhoto=id;const pv=$("#phPrev");pv.outerHTML=`<img id="phPrev" src="${d}" alt="" style="width:72px;height:72px;border-radius:12px;object-fit:cover">`;cb&&cb(id)})}
function shrink(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=900,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};img.onerror=()=>res(null);img.src=u})}

/* ---------- register wizard ---------- */
function startReg(id){wz={step:id?2:1,id:id||null,main:false,children:[],loc:null,gps:null,gpsState:"idle",status:"in_store"};push("register")}
function stepsBar(n,names){return `<div><div class="steps">${names.map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div><div class="stepname">${n}/${names.length} · ${h(names[n-1])}</div></div>`}
function vRegister(){
  const names=[t("w1"),t("w2"),t("w3"),t("w4"),t("w5")],s=wz.step;let body="";
  if(s===1)body=`<p class="muted">${h(t("w1help"))}</p>
    <button class="scanbtn" data-act="wzScanLabel">${I.scan}${h(t("scanLabel"))}</button>
    <button class="btn ghost block" data-act="wzAuto">${h(t("autoId",{id:nextLabel()}))}</button>`;
  if(s===2)body=`<div class="card"><div class="muted small">ID</div><div class="idbig">${h(wz.id)}</div></div>
    <form class="form" id="wf">${photoField(wz.photo)}${partFields(wz)}
    <label class="f">${h(t("f_status"))}<select id="e_status">${STATUSES.filter(x=>x!=="scrapped").map(x=>`<option value="${x}" ${wz.status===x?"selected":""}>${h(t("s_"+x))}</option>`).join("")}</select></label>
    <label class="check"><input type="checkbox" id="e_main" ${wz.main?"checked":""}><span><b>${h(t("isMain"))}</b><small>${h(t("isMainHelp"))}</small></span></label>
    <div class="btns"><button type="button" class="btn" data-act="wzBack">${h(t("back"))}</button><button class="btn primary" type="submit">${h(t("next"))}</button></div></form>`;
  if(s===3)body=`<p class="muted">${h(t("compHelp",{id:wz.id}))}</p>
    <div class="list">${wz.children.length?wz.children.map((c,i)=>`<div class="item child" style="cursor:default">${c.photo&&S.photos[c.photo]?`<img class="thumb" src="${S.photos[c.photo]}" alt="">`:`<div class="thumb">${h(initials(c.name))}</div>`}<span class="body"><input type="text" data-cn="${i}" value="${h(c.name)}" placeholder="${h(t("compName"))}" aria-label="${h(t("compName"))}"><span class="s mono">${h(c.id)}</span></span><label class="btn outline" style="min-height:40px;padding:8px" aria-label="${h(t("addPhoto"))}">${I.cam}<input type="file" accept="image/*" capture="environment" data-cp="${i}" hidden></label><button class="btn ghost" data-act="wzDelChild" data-i="${i}" aria-label="remove">✕</button></div>`).join(""):`<div class="empty">${h(t("noComps"))}</div>`}</div>
    <button class="scanbtn" data-act="wzScanChild">${I.scan}${h(t("scanComp"))}</button>
    <button class="btn ghost block" data-act="wzAutoChild">${h(t("autoId",{id:nextLabel()}))}</button>
    <div class="btns"><button class="btn" data-act="wzBack">${h(t("back"))}</button><button class="btn primary" data-act="wzToLoc">${h(t("next"))}</button></div>`;
  if(s===4)body=`<p class="muted">${h(t("locHelp"))}</p>
    ${wz.loc?`<div class="card"><div class="muted small">${h(t("f_loc"))}</div><div style="font-weight:600">${h(locPath(wz.loc))}</div><div class="mono small muted">${h(wz.loc)}</div></div>`:""}
    <button class="scanbtn" data-act="wzScanLoc">${I.places}${h(t("scanLoc"))}</button>
    ${gpsLine(wz)}
    <div class="btns"><button class="btn" data-act="wzBack">${h(t("back"))}</button><button class="btn primary" data-act="wzToReview" ${wz.loc?"":"disabled"}>${h(t("next"))}</button></div>`;
  if(s===5){const all=[wz,...wz.children];const res=evalLoc(null,wz.loc,wz.gps);
    body=`<div class="card"><p style="margin:0 0 10px">${h(t("review",{n:all.length,l:locPath(wz.loc)}))}</p><div class="list">${all.map((c,i)=>`<div class="item ${i?"child":""}" style="cursor:default"><div class="thumb">${h(initials(c.name))}</div><span class="body"><span class="t">${h(c.name)}</span><span class="s mono">${h(c.id)}</span></span></div>`).join("")}</div></div>
    <div class="results">${res.map(resHtml).join("")}</div>
    <div class="btns"><button class="btn" data-act="wzBack">${h(t("back"))}</button><button class="btn primary" data-act="wzSave">${h(t("save"))}</button></div>`}
  return{title:t("actRegister"),html:stepsBar(s,names)+body,after(){
    if(s===2){bindPhoto(id=>wz.photo=id);$("#wf").addEventListener("submit",e=>{e.preventDefault();const v=readPart();if(!v.name)return toast(t("required",{f:t("f_name")}));Object.assign(wz,v);wz.status=$("#e_status").value;wz.main=$("#e_main").checked;wz.step=wz.main?3:4;if(wz.step===4)autoGps(wz);render()})}
    if(s===3){document.querySelectorAll("[data-cn]").forEach(i=>i.addEventListener("input",()=>wz.children[+i.dataset.cn].name=i.value));
      document.querySelectorAll("[data-cp]").forEach(i=>i.addEventListener("change",async()=>{const f=i.files[0];if(!f)return;const d=await shrink(f),id="ph_"+uid();putPhoto(id,d);wz.children[+i.dataset.cp].photo=id;render()}))}
  }};
}
function idTaken(id){return P(id)||(wz&&(wz.id===id||wz.children.some(c=>c.id===id)))}
function bumpSeq(id){const m=new RegExp("^AST-"+set.dev+"(\\d{5})$").exec(id);if(m&&+m[1]>=set.labelSeq){set.labelSeq=+m[1]+1;saveSet()}}
function claimAuto(){const id=nextLabel();set.labelSeq++;saveSet();return id}

/* ---------- GPS ---------- */
function getGps(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const tm=setTimeout(()=>{if(!done){done=true;res(null)}},20000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tm);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()})},()=>{if(done)return;done=true;clearTimeout(tm);res(null)},{enableHighAccuracy:true,timeout:18000,maximumAge:15000})}catch(e){done=true;res(null)}})}
async function autoGps(o){o.gpsState="wait";o.gps=null;render();const g=await getGps();o.gps=g;o.gpsState=g?"ok":"bad";render()}
function gpsLine(o){const st=o.gpsState;return `<div class="card gps"><span class="dot ${st==="ok"?"ok":st==="wait"?"wait":st==="bad"?"bad":""}"></span><span style="flex:1">${st==="wait"?h(t("gpsGetting")):st==="ok"?h(t("gpsOk",{a:Math.round(o.gps.acc)}))+` <span class="muted small mono">${o.gps.lat.toFixed(5)}, ${o.gps.lng.toFixed(5)}</span>`:st==="bad"?h(t("gpsNone")):"GPS"}</span>${st!=="wait"?`<button class="btn ghost" data-act="gpsRetry">${h(t("gpsRetry"))}</button>`:""}</div>`}

/* ---------- location evaluation ---------- */
function evalLoc(part,locId,gps){
  const out=[];
  if(part){if(!part.loc)out.push({k:"info",m:t("rFirst")});else if(part.loc===locId)out.push({k:"ok",m:t("rSame")});else out.push({k:"warn",m:t("rMoved",{a:locPath(part.loc)})})}
  const area=locArea(locId);let gpsOut=null;
  if(gps&&area){const d=dist(gps,area);if(gps.acc>Math.max(100,area.radius*2))out.push({k:"info",m:t("rGpsLow",{a:Math.round(gps.acc)})});
    else if(d>area.radius){gpsOut=d;out.push({k:"bad",m:t("rGpsOut",{d,r:area.radius})})}else{gpsOut=0;out.push({k:"ok",m:t("rGpsIn",{d})})}}
  else if(gps&&!area)out.push({k:"info",m:t("rNoPoint")});
  if(part){const r=rootOf(part),mem=[r,...desc(r.id)].filter(m=>m.id!==part.id&&m.status!=="installed"&&m.status!=="scrapped"&&m.loc&&m.loc!==locId&&!(ck&&ck.seen&&ck.seen[m.id]));
    if(mem.length)out.push({k:"warn",m:t("rSplit",{x:mem.map(m=>m.name+" ("+locPath(m.loc)+")").join(", ")})})}
  out.gpsOut=gpsOut;return out;
}

/* ---------- scanner ---------- */
let scanStream=null,scanRAF=null;
function stopScan(){if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;if(scanStream)scanStream.getTracks().forEach(x=>x.stop());scanStream=null;const m=$(".modal");m&&m.remove()}
function scan(kind){ // kind: part|loc
  return new Promise(resolve=>{
    stopScan();
    const unused=[];for(let i=0;i<8;i++){const id="AST-"+set.dev+String(set.labelSeq+i).padStart(5,"0");if(!P(id)&&!(wz&&(wz.id===id||wz.children.some(c=>c.id===id))))unused.push(id)}
    const opts=kind==="loc"?`<optgroup label="${h(t("places"))}">${S.locations.map(l=>`<option value="${h(l.id)}">${h(locPath(l.id))} (${h(l.id)})</option>`).join("")}</optgroup>`
      :`<optgroup label="${h(t("newParts"))}">${unused.map(i=>`<option>${i}</option>`).join("")}</optgroup><optgroup label="${h(t("existing"))}">${S.parts.map(p=>`<option value="${h(p.id)}">${h(p.name)} (${h(p.id)})</option>`).join("")}</optgroup>`;
    const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
    m.innerHTML=`<div class="sheet"><h3>${h(kind==="loc"?t("scanLoc"):t("scanTitle"))}</h3>
      <div class="viewfinder"><video playsinline muted></video><div class="msg" id="scMsg">${h(t("scanTitle"))}</div></div>
      <label class="btn outline block">${I.cam} ${h(t("photoQr"))}<input type="file" id="scPhoto" accept="image/*" capture="environment" hidden></label>
      <form class="inline" id="scForm"><input type="text" id="scCode" placeholder="${h(t("typeCode"))}" aria-label="${h(t("typeCode"))}" autocapitalize="characters"><button class="btn primary" type="submit">${h(t("go"))}</button></form>
      <label class="f">${h(t("pick"))}<select id="scPick"><option value="">${h(t("choose"))}</option>${opts}</select></label>
      <button class="btn block" id="scCancel">${h(t("cancel"))}</button></div>`;
    document.body.appendChild(m);
    const finish=code=>{code=(code||"").trim().toUpperCase();if(!code)return;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){};stopScan();resolve(code)};
    m.querySelector("#scCancel").onclick=()=>{stopScan();resolve(null)};
    m.addEventListener("click",e=>{if(e.target===m){stopScan();resolve(null)}});
    m.querySelector("#scForm").onsubmit=e=>{e.preventDefault();finish(m.querySelector("#scCode").value)};
    m.querySelector("#scPick").onchange=e=>finish(e.target.value);
    m.querySelector("#scPhoto").onchange=async e=>{const f=e.target.files[0];if(!f)return;const c=await decodeFile(f);if(c)finish(c);else toast(t("noQr"))};
    const video=m.querySelector("video"),msg=m.querySelector("#scMsg");
    const noCam=()=>{msg.textContent=t("camNo")};
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return noCam();
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(st=>{
      if(!document.body.contains(m)){st.getTracks().forEach(x=>x.stop());return}
      scanStream=st;video.srcObject=st;video.play().catch(()=>{});msg.textContent="";
      const det=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null;
      const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let busy=false;
      const loop=async()=>{if(!scanStream)return;if(!busy&&video.readyState>=2){busy=true;try{
        if(det){const r=await det.detect(video);if(r[0])return finish(r[0].rawValue)}
        else if(window.jsQR){const w=Math.min(640,video.videoWidth),hh=Math.round(video.videoHeight*w/video.videoWidth);cv.width=w;cv.height=hh;cx.drawImage(video,0,0,w,hh);const d=cx.getImageData(0,0,w,hh);const r=jsQR(d.data,w,hh,{inversionAttempts:"dontInvert"});if(r&&r.data)return finish(r.data)}
      }catch(e){}busy=false}scanRAF=requestAnimationFrame(loop)};loop();
    }).catch(noCam);
  });
}
function decodeFile(f){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=async()=>{const s=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s|0;c.height=img.height*s|0;const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  try{if("BarcodeDetector" in window){const r=await new BarcodeDetector({formats:["qr_code"]}).detect(c);if(r[0])return res(r[0].rawValue)}}catch(e){}
  if(window.jsQR){const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height);if(r&&r.data)return res(r.data)}res(null)};img.onerror=()=>res(null);img.src=u})}
